services:
  agent:
    build: .
    image: meals-planner-agent:local
    platform: linux/amd64
    environment:
      AGENT_ID: meals-planner
      # Passed at run time, never baked into the image: the image is published
      # and installed by strangers, and these are one installation's own keys.
      # Set them in a .env beside this file, or export them before compose up.
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
      # Where Kroger sends people after login; the shared code page by default.
      KROGER_REDIRECT_URI: ${KROGER_REDIRECT_URI:-}
      USDA_API_KEY: ${USDA_API_KEY:-}
      # development until Instacart approves a production key.
      INSTACART_API_KEY: ${INSTACART_API_KEY:-}
      INSTACART_ENV: ${INSTACART_ENV:-development}
      # Price and nutrition snapshots live in the volume, not the image: Kroger's
      # terms cover calling their API for your own planning, not shipping their
      # prices to everyone who installs this.
      MEALS_PRICES_DIR: /var/lib/hermes/meals
    volumes:
      - type: bind
        source: ./plow-credentials
        target: /var/lib/plow/credentials.host
        read_only: true
        bind:
          create_host_path: false
      - agent-home:/var/lib/hermes
    restart: unless-stopped
    stop_grace_period: 35s
volumes:
  agent-home:
